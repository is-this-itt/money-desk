name: Independent security review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Only for branches in this repository (never for forks).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Instructions always come from the base branch, so a pull request can't rewrite them.
      - name: Load review instructions from base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git show "origin/$BASE_REF:.github/security-review-instructions.md" > "$RUNNER_TEMP/review-instructions.md"

      - uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read your instructions from ${{ runner.temp }}/review-instructions.md and follow them.
            Review this pull request's changes (use `gh pr diff`) and read any other files in the
            repository you need for context.

            Post your full review as one comment on the pull request with `gh pr comment`, and add
            inline comments on specific lines where useful.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
