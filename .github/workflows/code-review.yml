name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Only for branches in this repository (never for forks).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Instructions always come from the base branch, so a pull request can't rewrite them.
      - name: Load review instructions from base branch
        id: instructions
        run: |
          if git show "origin/${{ github.event.pull_request.base.ref }}:.github/code-review-instructions.md" > "$RUNNER_TEMP/review-instructions.md"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No code review instructions on the base branch yet, so the review is skipped."
          fi

      - uses: anthropics/claude-code-action@v1
        if: steps.instructions.outputs.found == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read your instructions from ${{ runner.temp }}/review-instructions.md and follow them.
            Review this pull request's changes (use `gh pr diff`) and read any other files in the
            repository you need for context.

            Post your full review as one comment on the pull request with `gh pr comment`, and add
            inline comments on specific lines where useful.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
